services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: support_reply_assistant
      POSTGRES_USER: support
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local environment}
    ports:
      - "5432:5432"
    volumes:
      - support_reply_assistant_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support -d support_reply_assistant"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  support_reply_assistant_pgdata:
